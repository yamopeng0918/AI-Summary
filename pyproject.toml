[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-digest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
    "httpx>=0.28,<1",
    "trafilatura>=2,<3",
    "openai>=1.99,<3",
    "google-genai>=2.7,<3",
    "scikit-learn>=1.9,<2",
    "joblib>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
ai-digest = "ai_digest.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
